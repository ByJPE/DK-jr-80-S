}
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;upd(dt);draw();requestAnimationFrame(loop)}
function rs(){const t=matchMedia('(pointer:coarse)').matches;P.style.display=t?'flex':'none';const ah=innerHeight-(t?170:12),s=Math.min(innerWidth/W,ah/H);G.style.width=W*s+'px';G.style.height=H*s+'px'}
addEventListener('resize',rs);rs();
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',Space:'j',KeyZ:'j'};
addEventListener('keydown',e=>{const c=KM[e.code];if(c){e.preventDefault();if(c=='j'){if(!e.repeat){if(g.s=='play')jump();else start()}}else k[c]=1}else if(e.code=='Enter')start()});
addEventListener('keyup',e=>{const c=KM[e.code];if(c&&c!='j')k[c]=0});
document.querySelectorAll('button').forEach(b=>{const c=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(c=='j'){if(g.s=='play')jump();else start()}else k[c]=1});['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>{if(c!='j')k[c]=0}))});
G.addEventListener('pointerdown',()=>start());
requestAnimationFrame(loop);
</script></body></html>
